# Modo "PC": a mesma stack da VPS rodando no Docker Desktop do Windows. O HTTPS público vem do
# Tailscale Funnel instalado no Windows (https://<pc>.<tailnet>.ts.net -> 127.0.0.1:8080), no lugar
# do Caddy. Não abre porta no roteador e não precisa de IP fixo.
#
#   docker compose -f docker-compose.yml -f docker-compose.pc.yml up -d
#   (o start-pc.ps1 faz isso e gera o .env)
#
# Só fica no ar com o PC ligado, sem hibernar e com internet.
services:
  caddy:
    # Fora do modo PC: o Funnel faz o HTTPS.
    profiles: ["vps"]

  # No Windows não há cron: backup diário e limpeza de mensagens rodam neste container.
  maintenance:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: evolution
      PGDATABASE: evolution
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MESSAGE_RETENTION_DAYS: ${MESSAGE_RETENTION_DAYS:-30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./maintenance-loop.sh:/maintenance-loop.sh:ro
      - ./backups:/backups
    command: ["sh", "/maintenance-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
