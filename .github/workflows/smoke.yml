name: Smoke pós-deploy

# A Vercel avisa o GitHub com um commit status (não com Deployments). O contexto era "Vercel"; desde que o
# projeto soci-docs foi ligado ao repositório, cada projeto tem o seu ("Vercel – soci-app-br", "Vercel – soci-docs")
# e só o do app conta. Aceita os dois nomes do app.
# Quando esse status fica "success" num commit da main, o deploy de produção está pronto:
# o smoke confere https://soci.app.br. Também dá para rodar à mão (Actions → Run workflow),
# inclusive contra um preview protegido, com o segredo VERCEL_AUTOMATION_BYPASS_SECRET.
on:
  status:
  workflow_dispatch:
    inputs:
      url:
        description: Endereço a testar
        required: true
        default: https://soci.app.br

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.context == 'Vercel' || github.event.context == 'Vercel – soci-app-br') && github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm run smoke -- "$SMOKE_URL"
        env:
          SMOKE_URL: ${{ inputs.url || 'https://soci.app.br' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
